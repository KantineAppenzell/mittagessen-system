name: Supabase Backup

# Erstellt taeglich einen verschluesselten Datenbank-Export und laedt ihn
# in ein privates GitHub-Repo hoch. Läuft NICHT im selben (öffentlichen)
# Repo wie die Webseite, siehe Anleitung unten.

on:
  schedule:
    - cron: "15 2 * * *"   # taeglich 02:15 UTC (03:15 bzw. 04:15 Schweizer Zeit)
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: pg_dump installieren
        run: sudo apt-get update && sudo apt-get install -y postgresql-client age

      - name: Datenbank exportieren und verschluesseln
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          AGE_PUBLIC_KEY: ${{ secrets.BACKUP_AGE_PUBLIC_KEY }}
        run: |
          STAMP=$(date +%Y-%m-%d_%H%M)
          pg_dump "$DB_URL" -Fc -f "db_$STAMP.dump"
          age -R <(echo "$AGE_PUBLIC_KEY") -o "db_$STAMP.dump.age" "db_$STAMP.dump"
          rm "db_$STAMP.dump"
          echo "STAMP=$STAMP" >> "$GITHUB_ENV"

      - name: In privates Backup-Repo hochladen
        env:
          GH_TOKEN: ${{ secrets.BACKUP_REPO_TOKEN }}
        run: |
          git clone "https://x-access-token:${GH_TOKEN}@github.com/${{ secrets.BACKUP_REPO }}.git" backup-repo
          mkdir -p backup-repo/taeglich
          mv "db_${STAMP}.dump.age" backup-repo/taeglich/
          cd backup-repo
          git config user.name "Backup Bot"
          git config user.email "backup-bot@example.com"
          git add taeglich/
          # Backups aelter als 14 Tage entfernen
          find taeglich -type f -mtime +14 -delete
          git add -A
          git commit -m "Backup ${STAMP}" || echo "Nichts zu committen"
          git push
