name: Supabase Keepalive

# Verhindert, dass das Supabase-Projekt wegen Inaktivität pausiert wird
# (Free-Plan: Pausierung nach ca. 7 Tagen ohne Datenbank-Aktivität).
# Läuft alle 3 Tage und macht eine winzige, harmlose Leseabfrage.

on:
  schedule:
    - cron: "0 6 */3 * *"   # alle 3 Tage, 06:00 UTC
  workflow_dispatch:         # erlaubt manuelles Auslösen zum Testen

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Supabase anpingen
        run: |
          curl -sS -X GET \
            "${{ secrets.SUPABASE_URL }}/rest/v1/menu_files?select=id&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" \
            -w "\nHTTP-Status: %{http_code}\n" \
            -o /dev/null
